services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facilities
      POSTGRES_USER: facilities
      POSTGRES_PASSWORD: facilities_dev_password
    ports:
      - "5432:5432"
    volumes:
      - facilities-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilities -d facilities"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  facilities-postgres-data:
